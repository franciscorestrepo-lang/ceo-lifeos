<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualizar CEO LifeOS</title><link rel="stylesheet" href="styles.css"></head><body><main style="max-width:900px"><p class="eyebrow">ADMINISTRACIÓN</p><h1>Actualizar CEO LifeOS</h1><p class="muted">Pega el JSON generado por la revisión semanal. La actualización se guarda en Netlify Blobs y aparece sin volver a desplegar.</p><section class="panel"><label>Token de administración</label><input id="token" type="password" style="width:100%;margin:8px 0 18px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:white"><label>JSON semanal</label><textarea id="json" rows="22" style="width:100%;margin:8px 0 18px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:white;font-family:monospace"></textarea><div style="display:flex;gap:10px"><button id="load" class="secondary">Cargar actual</button><button id="save" class="primary">Guardar actualización</button><a href="/" class="secondary" style="text-decoration:none">Volver</a></div><p id="status" class="muted"></p></section></main><script>
const status=document.getElementById('status');
document.getElementById('load').onclick=async()=>{const r=await fetch('/.netlify/functions/dashboard-data');document.getElementById('json').value=JSON.stringify(await r.json(),null,2)};
document.getElementById('save').onclick=async()=>{try{const data=JSON.parse(document.getElementById('json').value);const r=await fetch('/.netlify/functions/update-dashboard',{method:'POST',headers:{'content-type':'application/json','x-admin-token':document.getElementById('token').value},body:JSON.stringify(data)});const out=await r.json();if(!r.ok)throw new Error(out.error||'Error');status.textContent='Actualizado correctamente';}catch(e){status.textContent='Error: '+e.message}};
</script></body></html>
