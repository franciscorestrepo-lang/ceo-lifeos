<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CEO LifeOS</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><header class="topbar"><div><div class="eyebrow">CEO COMMAND CENTER</div><h1>LifeOS</h1><div id="syncStatus">Cargando...</div></div><a class="btn primary" href="https://chatgpt.com/" target="_blank">Actualizar con ChatGPT</a></header><nav class="tabs"><button class="tab active" data-view="home">Home</button><button class="tab" data-view="finance">Finanzas</button></nav><section id="home" class="view active"><article class="hero card"><div class="eyebrow">ESTADO EJECUTIVO</div><h2 id="status">CARGANDO</h2><p id="summary">Leyendo la última revisión publicada desde GitHub.</p><div id="score"></div></article><div class="section-head"><h3>Resultados críticos</h3></div><div id="critical" class="stack"></div><div class="section-head"><h3>Decisiones</h3></div><div id="decisions" class="stack"></div><div class="section-head"><h3>Mis acciones</h3></div><div id="actions" class="stack"></div></section><section id="finance" class="view"><div class="section-head"><div><div class="eyebrow">PERSONAL / CEO</div><h3>Financial Control</h3></div><span id="coverage" class="source-pill warn">Cargando...</span></div><div id="finMetrics" class="metric-grid"></div><div class="finance-toolbar"><div class="segmented"><button class="segment fin-range active" data-range="30">30 días</button><button class="segment fin-range" data-range="90">90 días</button><button class="segment fin-range" data-range="365">1 año</button><button class="segment fin-range" data-range="all">Todo</button></div><div class="finance-dates"><label>Desde <input id="fStart" type="date"></label><label>Hasta <input id="fEnd" type="date"></label><button id="fApply" class="btn ghost">Aplicar</button></div></div><div id="finCompare" class="notice"></div><div class="two-col"><article class="card"><h3>Tendencia</h3><canvas id="daily" class="fin-chart"></canvas></article><article class="card"><h3>Categorías</h3><canvas id="cats" class="fin-chart"></canvas></article></div><div class="section-head"><h3>Últimos movimientos</h3></div><div id="tx" class="stack"></div></section></main><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cop=v=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(v||0);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const item=(t,m='')=>'<article class="item"><div class="item-title">'+esc(t)+'</div><div class="item-meta">'+esc(m)+'</div></article>';
const metric=(l,v)=>'<div class="metric"><strong>'+esc(v)+'</strong><span>'+esc(l)+'</span></div>';
let current=null,financial=null,range='30',custom=null;
async function get(path){for(const u of ['/data/'+path+'?t='+Date.now(),'https://raw.githubusercontent.com/franciscorestrepo-lang/ceo-lifeos/main/data/'+path+'?t='+Date.now()]){try{const r=await fetch(u,{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}}throw new Error(path)}
function renderHome(){const d=current;$('#status').textContent=d.meta?.status||d.overall_status||'AT_RISK';$('#summary').textContent=d.executive_summary||d.meta?.executive_summary||'Revisión cargada.';$('#score').textContent=(d.meta?.score??d.score??'—')+'/100';$('#critical').innerHTML=(d.critical_outcomes||[]).map(x=>item(x.title||x.expected_result,(x.company||'')+' · '+(x.metric||''))).join('')||item('Sin resultados');$('#decisions').innerHTML=(d.decisions||[]).map(x=>item(x.title||x.decision,(x.company||'')+' · '+(x.metric||''))).join('')||item('Sin decisiones');$('#actions').innerHTML=(d.my_actions||[]).map(x=>item(x.title||x.action,(x.company||'')+' · '+(x.date||x.deadline||''))).join('')||item('Sin acciones')}
function rowsFor(a,b){return (financial.transactions||[]).filter(x=>x.scope==='Personal'&&x.date>=a&&x.date<=b)}
function bounds(){const tx=financial.transactions||[],dates=tx.map(x=>x.date).sort(),end=custom?.[1]||dates.at(-1),e=new Date(end+'T12:00:00');let s;if(custom)s=new Date(custom[0]+'T12:00:00');else if(range==='all')s=new Date(dates[0]+'T12:00:00');else{s=new Date(e);s.setDate(s.getDate()-Number(range)+1)}return [s.toISOString().slice(0,10),end]}
function draw(id,rows){const c=$(id),ctx=c.getContext('2d'),w=c.clientWidth||500,h=240,d=window.devicePixelRatio||1;c.width=w*d;c.height=h*d;ctx.scale(d,d);ctx.clearRect(0,0,w,h);if(!rows.length){ctx.fillStyle='#91a5bf';ctx.fillText('Sin datos',20,30);return}const max=Math.max(...rows.map(x=>x.v),1),pad=30,bw=Math.max(4,(w-pad*2)/rows.length-6);rows.forEach((x,i)=>{const bh=(h-55)*x.v/max,left=pad+i*((w-pad*2)/rows.length),top=h-35-bh;ctx.fillStyle='#6aa8ff';ctx.fillRect(left,top,bw,bh);ctx.fillStyle='#91a5bf';ctx.font='10px system-ui';ctx.textAlign='center';if(rows.length<15||i%Math.ceil(rows.length/10)===0)ctx.fillText(x.k.slice(0,10),left+bw/2,h-18)})}
function renderFinance(){if(!financial)return;const [a,b]=bounds(),rows=rowsFor(a,b),cons=rows.filter(x=>x.method!=='Transferencia'),trans=rows.filter(x=>x.method==='Transferencia'),ct=cons.reduce((s,x)=>s+x.amount,0),tt=trans.reduce((s,x)=>s+x.amount,0);$('#coverage').textContent=a+' → '+b+' · '+rows.length+' movimientos';$('#finMetrics').innerHTML=[['Consumo',cop(ct)],['Transferencias',cop(tt)],['Movimientos',rows.length],['Promedio diario',cop(ct/Math.max(1,(new Date(b)-new Date(a))/86400000+1))]].map(x=>metric(x[0],x[1])).join('');const daily={};cons.forEach(x=>daily[x.date]=(daily[x.date]||0)+x.amount);const cats={};cons.forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);draw('#daily',Object.entries(daily).sort().map(([k,v])=>({k,v})));draw('#cats',Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({k,v})));$('#tx').innerHTML=rows.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,50).map(x=>item(x.merchant,x.date+' · '+x.category+' · '+x.method+' · '+cop(x.amount))).join('')||item('Sin movimientos');$('#fStart').value=a;$('#fEnd').value=b;$('#finCompare').textContent=financial.meta?.data_quality==='PARTIAL_HISTORY'?'Histórico parcial: las tendencias ganan confiabilidad a medida que se acumulan semanas.':'Histórico disponible.'}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));$$('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.view).classList.add('active')});
$$('.fin-range').forEach(b=>b.onclick=()=>{range=b.dataset.range;custom=null;$$('.fin-range').forEach(x=>x.classList.toggle('active',x===b));renderFinance()});
$('#fApply').onclick=()=>{const a=$('#fStart').value,b=$('#fEnd').value;if(!a||!b||a>b)return;custom=[a,b];$$('.fin-range').forEach(x=>x.classList.remove('active'));renderFinance()};
(async()=>{try{[current,financial]=await Promise.all([get('current.json'),get('financial.json')]);renderHome();renderFinance();$('#syncStatus').textContent='Actualizado · '+(current.meta?.period||'')}catch(e){$('#syncStatus').textContent='Error de carga: '+e.message;$('#status').textContent='ERROR'}})();
</script></body></html>
